<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<style>
    :root {
        --primary: #58a6ff;
        --primary-dark: #1f6feb;
        --secondary: #7ee787;
        --background: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --text-muted: #8b949e;
    }
    
    body {
        background: var(--background);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }
    
    /* Animated background particles */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 20% 30%, rgba(88, 166, 255, 0.05) 0%, transparent 20%),
            radial-gradient(circle at 80% 70%, rgba(126, 231, 135, 0.03) 0%, transparent 20%),
            radial-gradient(circle at 40% 80%, rgba(31, 111, 235, 0.04) 0%, transparent 20%);
        z-index: -1;
    }
    
    .container {
        position: relative;
        z-index: 1;
    }
    
    .feedback-card {
        background: var(--card-bg);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 
            0 20px 60px rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(88, 166, 255, 0.1),
            inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .feedback-card:hover {
        transform: translateY(-5px);
        box-shadow: 
            0 25px 80px rgba(88, 166, 255, 0.15),
            0 0 0 1px rgba(88, 166, 255, 0.2);
    }
    
    .feedback-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        border-radius: 20px 20px 0 0;
    }
    
    h3 {
        color: var(--primary);
        font-weight: 700;
        text-align: center;
        margin-bottom: 35px;
        position: relative;
        padding-bottom: 15px;
    }
    
    h3::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), transparent);
        border-radius: 3px;
    }
    
    .form-icon {
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
        box-shadow: 0 10px 20px rgba(88, 166, 255, 0.3);
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    
    label {
        color: var(--primary);
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 8px;
        display: block;
        transition: color 0.3s ease;
    }
    
    .form-control {
        background: rgba(13, 17, 23, 0.7);
        border: 2px solid var(--border);
        color: var(--text);
        padding: 12px 18px;
        border-radius: 12px;
        transition: all 0.3s ease;
        font-size: 1rem;
    }
    
    .form-control:focus {
        background: rgba(13, 17, 23, 0.9);
        border-color: var(--primary);
        color: var(--text);
        box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.15);
        transform: translateY(-2px);
    }
    
    .form-control::placeholder {
        color: var(--text-muted);
    }
    
    .form-group {
        margin-bottom: 25px;
        position: relative;
    }
    
    .form-group i {
        position: absolute;
        right: 18px;
        top: 42px;
        color: var(--text-muted);
        font-size: 1.1rem;
    }
    
    .rating-stars {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    
    .star-option {
        flex: 1;
        text-align: center;
        padding: 12px;
        background: rgba(13, 17, 23, 0.7);
        border: 2px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .star-option:hover {
        border-color: var(--primary);
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(88, 166, 255, 0.1);
    }
    
    .star-option input[type="radio"] {
        display: none;
    }
    
    .star-option label {
        cursor: pointer;
        display: block;
        color: var(--text-muted);
        transition: color 0.3s ease;
    }
    
    .star-option:hover label,
    .star-option input[type="radio"]:checked + label {
        color: #ffd700;
    }
    
    .submit-btn {
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        border: none;
        padding: 16px 32px;
        font-weight: 600;
        font-size: 1.1rem;
        border-radius: 12px;
        color: white;
        width: 100%;
        margin-top: 10px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(88, 166, 255, 0.3);
    }
    
    .submit-btn:active {
        transform: translateY(-1px);
    }
    
    .submit-btn::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: 0.5s;
    }
    
    .submit-btn:hover::after {
        left: 100%;
    }
    
    .floating-icons {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
    }
    
    .floating-icon {
        position: absolute;
        color: rgba(88, 166, 255, 0.1);
        font-size: 1.5rem;
        animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    .character-count {
        text-align: right;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-top: 5px;
    }
    
    .character-count.warning {
        color: #ffa500;
    }
    
    .character-count.danger {
        color: #ff4444;
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
        .feedback-card {
            padding: 25px;
            margin: 15px;
        }
        
        .rating-stars {
            flex-direction: column;
        }
        
        .form-icon {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
        }
    }
</style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="feedback-card animate__animated animate__fadeInUp">
                <!-- Floating decorative icons -->
                <div class="floating-icons">
                    <div class="floating-icon" style="top: 10%; left: 10%;"><i class="fas fa-star"></i></div>
                    <div class="floating-icon" style="top: 20%; right: 15%;"><i class="fas fa-heart"></i></div>
                    <div class="floating-icon" style="bottom: 30%; left: 15%;"><i class="fas fa-comment"></i></div>
                    <div class="floating-icon" style="bottom: 20%; right: 10%;"><i class="fas fa-thumbs-up"></i></div>
                </div>
                
                <div class="form-icon">
                    <i class="fas fa-comments fa-2x"></i>
                </div>
                
                <h3>Share Your Experience</h3>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label><i class="fas fa-user me-2"></i>Your Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                        <i class="fas fa-user"></i>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope me-2"></i>Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="your.email@example.com" required>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-star me-2"></i>Rate Your Experience</label>
                        <div class="rating-stars">
                            <div class="star-option">
                                <input type="radio" id="excellent" name="rating" value="Excellent ⭐⭐⭐⭐⭐">
                                <label for="excellent">Excellent ⭐⭐⭐⭐⭐</label>
                            </div>
                            <div class="star-option">
                                <input type="radio" id="good" name="rating" value="Good ⭐⭐⭐⭐">
                                <label for="good">Good ⭐⭐⭐⭐</label>
                            </div>
                            <div class="star-option">
                                <input type="radio" id="average" name="rating" value="Average ⭐⭐⭐">
                                <label for="average">Average ⭐⭐⭐</label>
                            </div>
                            <div class="star-option">
                                <input type="radio" id="poor" name="rating" value="Poor ⭐⭐">
                                <label for="poor">Poor ⭐⭐</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-comment-dots me-2"></i>Your Feedback</label>
                        <textarea name="message" rows="5" class="form-control" 
                                  placeholder="Tell us what you liked, what could be improved, or any suggestions..." 
                                  required 
                                  oninput="updateCharCount(this)"></textarea>
                        <i class="fas fa-edit"></i>
                        <div class="character-count" id="charCount">0/500 characters</div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-paper-plane me-2"></i> Submit Feedback
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-4 border-top border-secondary">
                    <small class="text-muted">
                        <i class="fas fa-lock me-1"></i>
                        Your feedback is confidential and helps us improve
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Character counter for feedback textarea
    function updateCharCount(textarea) {
        const charCount = document.getElementById('charCount');
        const count = textarea.value.length;
        charCount.textContent = `${count}/500 characters`;
        
        // Update color based on character count
        charCount.className = 'character-count';
        if (count > 400 && count <= 500) {
            charCount.classList.add('warning');
        } else if (count > 500) {
            charCount.classList.add('danger');
        }
        
        // Limit to 500 characters
        if (count > 500) {
            textarea.value = textarea.value.substring(0, 500);
            charCount.textContent = '500/500 characters (limit reached)';
        }
    }
    
    // Add animation to form elements on focus
    document.querySelectorAll('.form-control').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
    
    // Animate star options on hover
    document.querySelectorAll('.star-option').forEach(option => {
        option.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-5px) scale(1.05)';
        });
        
        option.addEventListener('mouseleave', function() {
            if (!this.querySelector('input').checked) {
                this.style.transform = 'translateY(0) scale(1)';
            }
        });
        
        // Keep selected option elevated
        option.querySelector('input').addEventListener('change', function() {
            document.querySelectorAll('.star-option').forEach(opt => {
                opt.style.transform = 'translateY(0) scale(1)';
            });
            if (this.checked) {
                this.parentElement.style.transform = 'translateY(-5px) scale(1.05)';
                this.parentElement.style.borderColor = 'var(--primary)';
            }
        });
    });
    
    // Form submission animation
    document.querySelector('form').addEventListener('submit', function(e) {
        const btn = this.querySelector('.submit-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Sending...';
        btn.disabled = true;
        
        // Simulate API call (remove in production)
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-check me-2"></i> Thank You!';
            btn.style.background = 'linear-gradient(135deg, #7ee787, #56d364)';
        }, 1500);
    });
</script>
</body>
</html>
